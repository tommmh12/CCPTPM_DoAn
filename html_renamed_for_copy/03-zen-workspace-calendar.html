<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zen Workspace - Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#142f4f",
                        "on-primary-fixed-variant": "#396355",
                        "tertiary": "#486083",
                        "inverse-on-surface": "#999d9f",
                        "on-secondary-fixed": "#174550",
                        "tertiary-fixed-dim": "#a4bde4",
                        "on-error": "#fff7f6",
                        "surface-tint": "#3d6758",
                        "surface": "#f6fafb",
                        "inverse-surface": "#0a0f10",
                        "surface-container": "#e8eff2",
                        "on-secondary": "#effbff",
                        "surface-container-low": "#eff4f7",
                        "secondary-fixed-dim": "#afdce9",
                        "background": "#f6fafb",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#bdeaf8",
                        "secondary-container": "#bdeaf8",
                        "outline-variant": "#aab4b7",
                        "error": "#a83836",
                        "on-primary": "#e4fff3",
                        "on-surface-variant": "#576164",
                        "on-secondary-fixed-variant": "#37616d",
                        "inverse-primary": "#cffeeb",
                        "error-dim": "#67040d",
                        "primary-container": "#beecda",
                        "error-container": "#fa746f",
                        "on-tertiary-container": "#2a4364",
                        "on-primary-fixed": "#1c4739",
                        "surface-bright": "#f6fafb",
                        "primary": "#3d6758",
                        "on-background": "#2b3437",
                        "secondary": "#3a6571",
                        "surface-dim": "#d2dcdf",
                        "tertiary-container": "#b2cbf3",
                        "on-surface": "#2b3437",
                        "primary-fixed": "#beecda",
                        "on-primary-container": "#2f594b",
                        "tertiary-dim": "#3b5476",
                        "outline": "#737c80",
                        "on-tertiary-fixed-variant": "#334c6e",
                        "on-error-container": "#6e0a12",
                        "surface-container-highest": "#dae4e8",
                        "surface-variant": "#dae4e8",
                        "primary-fixed-dim": "#b1decc",
                        "primary-dim": "#315b4d",
                        "on-secondary-container": "#2c5863",
                        "secondary-dim": "#2e5965",
                        "tertiary-fixed": "#b2cbf3",
                        "on-tertiary": "#f8f8ff",
                        "surface-container-high": "#e1e9ed"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Manrope"],
                        body: ["Inter"],
                        label: ["Inter"]
                    }
                }
            }
        };
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen" data-page="schedule">
<aside class="h-screen w-64 fixed left-0 top-0 bg-[#e8eff2] dark:bg-slate-900 flex flex-col h-full py-8 transition-all duration-300 z-50 hidden md:flex" style="box-shadow: 0px 12px 32px rgba(43,52,55,0.06);"></aside>
<header class="sticky top-0 z-40 flex h-16 items-center bg-background px-8 md:ml-64"></header>
<main class="md:ml-64 min-h-screen flex flex-col">
<div class="mx-auto w-full max-w-[1600px] p-8">
<section class="mb-8 flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
<div>
<p class="text-[11px] font-bold uppercase tracking-[0.18em] text-primary">Schedule</p>
<h1 class="mt-3 text-4xl font-extrabold text-on-surface" id="schedule-title">Schedule</h1>
<p class="mt-2 text-sm font-medium text-on-surface-variant" id="schedule-subtitle">Plan and review your workload.</p>
</div>
<div class="flex flex-wrap items-center gap-3">
<div class="flex items-center gap-2 rounded-full bg-surface-container-low p-1">
<button class="rounded-full px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-surface-variant transition-colors hover:bg-surface-container-high" data-schedule-nav="prev" type="button">Prev</button>
<button class="rounded-full bg-surface-container-high px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-surface transition-colors" data-schedule-nav="today" type="button">Today</button>
<button class="rounded-full px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-surface-variant transition-colors hover:bg-surface-container-high" data-schedule-nav="next" type="button">Next</button>
</div>
<div class="flex items-center gap-2 rounded-full bg-surface-container-low p-1">
<button class="rounded-full bg-primary px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-primary transition-colors" data-schedule-view="month" type="button">Month</button>
<button class="rounded-full px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-surface-variant transition-colors hover:bg-surface-container-high" data-schedule-view="week" type="button">Week</button>
<button class="rounded-full px-4 py-2 text-[11px] font-bold uppercase tracking-[0.16em] text-on-surface-variant transition-colors hover:bg-surface-container-high" data-schedule-view="day" type="button">Day</button>
</div>
</div>
</section>
<section class="mb-8 grid gap-4 md:grid-cols-4">
<div class="rounded-[1.8rem] bg-surface-container-lowest px-5 py-5 shadow-sm">
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-outline">In Range</p>
<p class="mt-3 text-3xl font-extrabold text-on-surface" id="schedule-scheduled-count">0</p>
</div>
<div class="rounded-[1.8rem] bg-surface-container-lowest px-5 py-5 shadow-sm">
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-outline">Open</p>
<p class="mt-3 text-3xl font-extrabold text-on-surface" id="schedule-open-count">0</p>
</div>
<div class="rounded-[1.8rem] bg-surface-container-lowest px-5 py-5 shadow-sm">
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-outline">Completed</p>
<p class="mt-3 text-3xl font-extrabold text-on-surface" id="schedule-completed-count">0</p>
</div>
<div class="rounded-[1.8rem] bg-surface-container-lowest px-5 py-5 shadow-sm">
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-outline">Unscheduled</p>
<p class="mt-3 text-3xl font-extrabold text-on-surface" id="schedule-unscheduled-count">0</p>
</div>
</section>
<section class="grid gap-8 xl:grid-cols-12">
<div class="xl:col-span-8">
<div class="mb-4 flex items-center justify-between gap-4">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-primary">Planner Board</p>
<h2 class="mt-2 text-2xl font-extrabold text-on-surface" id="schedule-range-label">Schedule</h2>
</div>
<button class="inline-flex items-center gap-2 rounded-full bg-primary px-4 py-3 text-sm font-bold text-on-primary transition-colors hover:bg-primary-dim" data-go-create-task type="button">
<span class="material-symbols-outlined text-base">add</span>
<span>New Task</span>
</button>
</div>
<div id="schedule-board"></div>
</div>
<aside class="xl:col-span-4">
<div class="rounded-[2rem] bg-surface-container-lowest p-6 shadow-sm">
<div class="mb-5">
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-primary">Selected Day</p>
<h3 class="mt-2 text-2xl font-extrabold text-on-surface" id="schedule-selected-label">Today</h3>
<p class="mt-1 text-sm text-on-surface-variant" id="schedule-selected-subtitle">No tasks scheduled yet.</p>
</div>
<div class="space-y-3" id="schedule-selected-list"></div>
</div>
</aside>
</section>
</div>
</main>
<div class="fixed inset-0 z-[90] hidden items-center justify-center bg-on-surface/50 px-4 backdrop-blur-sm" id="schedule-task-modal">
<div class="w-full max-w-2xl overflow-hidden rounded-[2rem] bg-surface-container-lowest shadow-[0_28px_80px_rgba(43,52,55,0.24)]">
<div class="flex items-start justify-between gap-4 border-b border-outline-variant/20 px-6 py-5">
<div>
<p class="text-[10px] font-bold uppercase tracking-[0.16em] text-primary">Schedule Detail</p>
<h3 class="mt-2 text-2xl font-extrabold text-on-surface" id="schedule-task-modal-title">Task detail</h3>
<p class="mt-1 text-sm text-on-surface-variant" id="schedule-task-modal-meta"></p>
</div>
<button class="inline-flex h-11 w-11 items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface" data-close-schedule-task-modal type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="max-h-[70vh] overflow-y-auto px-6 py-6" id="schedule-task-modal-body"></div>
</div>
</div>
<button class="fixed bottom-10 right-10 z-50 flex h-16 w-16 items-center justify-center rounded-full bg-primary text-on-primary shadow-2xl transition-transform hover:scale-110 md:hidden" data-go-create-task type="button">
<span class="material-symbols-outlined">add</span>
</button>
<p class="fixed bottom-4 left-1/2 -translate-x-1/2 text-sm font-medium text-primary" id="page-feedback"></p>
<script src="/assets/js/app.js"></script>
</body>
</html>
